name: Release

on:
  push:
    tags: ['*']

jobs:
  release:
    name: Build with castor, push to cachix, create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: mykiwi
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Authenticate composer's GitHub downloads to avoid the anonymous rate
      # limit, and retry the whole build as a backstop against remaining
      # transient failures.
      - run: |
          for i in 1 2 3; do
            nix-build nix/build.nix && exit 0
            echo "nix-build failed (attempt $i/3), retrying..."
            sleep 10
          done
          exit 1
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
